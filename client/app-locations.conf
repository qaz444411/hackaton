# ---------------------------------------------------------------
# 80 / 443 server 블록이 함께 include 하는 공통 설정.
# 한 곳만 고치면 양쪽에 같이 반영되므로 http/https 동작이 어긋나지 않는다.
# (특히 /socket.io 의 Upgrade 헤더는 빠지면 채팅 실시간 전송만 조용히 죽는다)
# ---------------------------------------------------------------

client_max_body_size 10m;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# 빌드 산출물은 파일명에 해시가 붙으므로 길게 캐시해도 안전하다
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # https 로 들어온 요청임을 백엔드에 알린다
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    # 이 두 줄이 없으면 wss 업그레이드가 실패해 폴링으로만 돌다가 끊긴다
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# React Router 경로에서 새로고침해도 404 가 나지 않게
location / {
    try_files $uri $uri/ /index.html;
}
