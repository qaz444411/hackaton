# ---------------------------------------------------------------
# client/vite.config.js 의 개발용 프록시와 같은 모양으로 맞춘다.
#   /api       -> api:4000
#   /socket.io -> api:4000 (웹소켓 업그레이드)
# 덕분에 VITE_API_BASE=/api, VITE_SOCKET_URL=/ 를 그대로 두고 배포할 수 있다.
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 빌드 산출물은 파일명에 해시가 붙으므로 길게 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        # 이 두 줄이 없으면 채팅이 폴링으로만 돌다가 끊긴다
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # React Router 경로에서 새로고침해도 404 가 나지 않게
    location / {
        try_files $uri $uri/ /index.html;
    }
}
