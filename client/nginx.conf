# ---------------------------------------------------------------
# 80 포트 — 앱 서빙 모드 (기본값).
#   인증서가 없거나 REDIRECT_HTTP_TO_HTTPS=0 이면 이 설정이 쓰인다.
#   발급이 실패해도 사이트가 http 로는 계속 살아 있게 하기 위한 것이다.
# ---------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # certbot webroot 챌린지. ^~ 로 다른 location 보다 먼저 매칭시킨다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-locations.conf;
}
