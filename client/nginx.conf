# ---------------------------------------------------------------
# 80 포트.
#   인증서 발급 전/후 모두 앱을 그대로 서빙한다.
#   443 으로의 리다이렉트는 HTTPS 가 실제로 동작하는 걸 확인한 뒤에 켠다
#   (REDIRECT_HTTP_TO_HTTPS=1). 그래야 발급이 실패해도 사이트가 죽지 않는다.
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # certbot webroot 챌린지. 리다이렉트보다 먼저 매칭되도록 ^~ 를 쓴다.
    # 갱신(renew)도 이 경로를 타므로 https 로 넘기지 않고 80 에서 직접 응답한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-locations.conf;
}
